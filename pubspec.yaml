name: realm_idle_game
description: RPG idle medieval dark rúnico com classes, coleta, combate e criação.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  image_path: "assets/images/medieval/app-icon-realm-crest.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/medieval/app-icon-realm-crest.png"
  windows:
    generate: true
    image_path: "assets/images/medieval/app-icon-realm-crest.png"
  web:
    generate: true
    image_path: "assets/images/medieval/app-icon-realm-crest.png"
    background_color: "#0D0E10"
    theme_color: "#0D0E10"

flutter_native_splash:
  color: "#0D0E10"
  image: "assets/images/medieval/app-icon-realm-crest.png"
  android_12:
    image: "assets/images/medieval/app-icon-realm-crest.png"
    color: "#0D0E10"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/medieval/
    - assets/images/medieval/gathering/minerios/
    - assets/images/medieval/gathering/madeiras/
    - assets/images/medieval/gathering/peixes/
    - assets/images/medieval/gathering/ferramentas/
    - assets/images/medieval/gathering/criaturas/
    - assets/images/medieval/gathering/classes/
    - assets/images/medieval/gathering/oficinas/
    - assets/images/medieval/gathering/equipamentos/
    - assets/images/medieval/gathering/pocoes/
    - assets/images/medieval/gathering/comidas/
    - assets/images/medieval/gathering/magias/
    - assets/images/medieval/gathering/barras/
    - assets/images/medieval/gathering/espolios/
